<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create PO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">PO Management System</a>
            <div>
                <a href="index.html" class="btn btn-sm btn-outline-light me-2">Home</a>
                <button class="btn btn-sm btn-danger" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>
    <div class="container mb-5 mt-5">
        <div class="card shadow border-0 rounded-4">
            <div class="card-header bg-white border-bottom py-3">
                <h3 class="mb-0 text-primary">Create Purchase Order</h3>
            </div>
            <div class="card-body p-4 p-md-5">
                <form id="createPoForm">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Select Vendor</label>
                        <select class="form-select form-select-lg" id="vendorSelect" required>
                            <option value="">Choose a vendor...</option>
                        </select>
                    </div>
                    
                    <h5 class="mb-3 border-bottom pb-2">Products</h5>
                    <div id="productRows">
                        <!-- Dynamic rows go here -->
                    </div>
                    
                    <div class="mt-3 text-center text-md-start">
                        <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="addProductRow()">+ Add Product Row</button>
                    </div>
                    
                    <div class="d-flex flex-column flex-md-row justify-content-between mt-5 border-top pt-4 align-items-md-center">
                        <div class="mb-3 mb-md-0">
                            <h4 class="mb-0 text-success">Total: $<span id="grandTotal">0.00</span></h4>
                            <div class="text-muted small">Includes 5% Tax</div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg px-5 rounded-pill shadow-sm">Submit Order</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadVendors();
            loadProducts().then(() => {
                addProductRow();
            });
            
            document.getElementById('createPoForm').addEventListener('submit', function(e) {
                e.preventDefault();
                submitOrder();
            });
        });
    </script>
</body>
</html>
