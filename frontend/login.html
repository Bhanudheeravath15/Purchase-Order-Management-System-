<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PO Management - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow border-0 rounded-4" style="width: 100%; max-width: 400px;">
        <div class="card-body p-4 p-md-5">
            <h3 class="text-center text-primary mb-2">OAuth JWT Login</h3>
            <p class="text-center text-muted small pb-3 border-bottom">Simulating a Public IDP (Google/Microsoft Identity Provider) token generation flow per requirements.</p>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Username</label>
                    <input type="text" id="username" class="form-control" value="admin" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" id="password" class="form-control" value="admin" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill">Sign In</button>
            </form>
            <div class="text-center mt-3 small text-muted">
                Demo Credentials: <br> admin / admin
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            performLogin();
        });
    </script>
</body>
</html>
