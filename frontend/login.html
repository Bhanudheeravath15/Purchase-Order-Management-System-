<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PO Management - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow border-0 rounded-4" style="width: 100%; max-width: 400px;">
        <div class="card-body p-4 p-md-5">
            <h3 class="text-center text-primary mb-2">OAuth JWT Login</h3>
            <p class="text-center text-muted small pb-3 border-bottom">Simulating a Public IDP (Google/Microsoft Identity Provider) token generation flow per requirements.</p>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Username</label>
                    <input type="text" id="username" class="form-control" value="admin" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" id="password" class="form-control" value="admin" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill">Sign In</button>
            </form>
            <div class="text-center mt-3 small text-muted">
                Demo Credentials: <br> admin / admin
            </div>
            
            <hr class="my-4">
            <h6 class="text-center text-muted mb-3 pb-2">Or sign in with Public IDP</h6>
            
            <div class="d-flex justify-content-center mb-2">
                <div id="g_id_onload"
                     data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="rectangular"
                     data-theme="outline"
                     data-text="sign_in_with"
                     data-size="large"
                     data-logo_alignment="left">
                </div>
            </div>
            
        </div>
    </div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            performLogin();
        });
    </script>
</body>
</html>
